<h1>schoolcal</h1>
<p>schoolcal is a private, single-family script. It reads school emails in its owner's own Gmail account and adds the school events it finds to a family Google Calendar, plus a short evening reminder email.</p>
<p>It is not a public service and cannot be used by anyone else.</p>
